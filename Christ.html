<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christ the Redeemer · Atelier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400&display=swap">
<style>
:root{--ink:#0d0f12;--ink2:#13161a;--marble:#e6e8ea;--mute:#6d737b;--line:#2a2f36;--tyrian:#c4468f;
--serif:"Bodoni Moda",Didot,Georgia,serif;--sans:Jost,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--marble);font:300 16px/1.5 var(--sans);min-height:100vh;padding:24px;overflow-y:auto}
main{width:min(1000px,100%);margin:0 auto;padding:3vh 0 56px;display:grid;gap:22px}
h1{font:italic 400 clamp(40px,8vw,88px)/1 var(--serif);letter-spacing:-.02em;text-align:center}
.stage{position:relative;width:min(100%,780px);margin:0 auto;aspect-ratio:664/412;overflow:hidden;background:#111;border:1px solid var(--line)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.flash.on{opacity:.9;transition:none}
.row{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
#shutter,#reload{width:84px;height:84px;border-radius:50%;background:transparent;cursor:pointer;flex:none;padding:0;position:relative}
#shutter{border:2px solid var(--marble)}
#shutter::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--marble);transition:transform .1s}
#shutter:active::after{transform:scale(.88)}
#shutter:disabled{cursor:default}#shutter:disabled::after{background:var(--mute)}
#reload{border:2px solid var(--tyrian);color:var(--tyrian);font-size:34px}
#prn{width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--mute);color:var(--marble);font-size:20px;cursor:pointer}
.ctl{display:flex;gap:6px}
.ctl button{font:400 15px var(--sans);color:var(--marble);background:transparent;border:1px solid var(--line);min-width:44px;height:36px;cursor:pointer}
.ctl button[aria-pressed=true]{border-color:var(--marble)}
.left{font:400 34px/1 var(--serif);min-width:2.2ch;text-align:right}
.panel{display:grid;grid-template-columns:170px 150px 1fr;gap:28px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.read{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center}
.read b{display:block;font:400 34px/1 var(--serif)}
.read svg{grid-column:2;grid-row:1/3;height:150px;width:34px}
.read span{font-size:13px;color:var(--mute)}
.read div+div{margin-top:10px}
.ana{list-style:none;padding:0;display:grid;gap:10px}
.ana li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:16px}
.ana i{width:22px;height:22px;border:1px solid var(--tyrian);border-radius:50%;font:400 12px/20px var(--sans);text-align:center;font-style:normal;color:var(--tyrian)}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fr{border-top:1px solid var(--line);padding-top:8px;min-height:130px}
.fr small{display:block;color:var(--mute);font-size:12px}
.fr .ph{aspect-ratio:4/3;background:var(--ink2);overflow:hidden;margin:6px 0}
.fr canvas{width:100%;height:100%;display:block}
.fr b{display:block;font:400 22px/1.1 var(--serif)}
.fr em{font:italic 400 14px var(--serif);color:#b9bec5}
.fr.empty{opacity:.5}
.pulse{animation:pl .35s}
@keyframes pl{50%{opacity:.3}}
#sheet h2{font:italic 400 clamp(30px,5vw,52px)/1.1 var(--serif);margin-bottom:6px}
#sum{color:#b9bec5}
#degs{font:400 20px/1.7 var(--serif);letter-spacing:.04em;margin:10px 0 20px;word-spacing:.3em}
.pb{font:400 16px var(--sans);color:var(--marble);background:transparent;border:1px solid var(--marble);padding:12px 28px;cursor:pointer}
:focus-visible{outline:2px solid var(--tyrian);outline-offset:3px}
@media(max-width:760px){.panel{grid-template-columns:1fr 1fr}.ana{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000;padding:0}main>*:not(#sheet){display:none!important}#sheet{display:block!important}#sheet h2,#sum,#degs,.fr b,.fr em,.fr small{color:#000}.fr{break-inside:avoid;border-color:#999}.row{display:none}}
</style>
</head>

 $('br').setAttribute('d',`M${x0-P} ${y0-P+l}V${y0-P}H${x0-P+l}M${x1+P-l} ${y0-P}H${x1+P}V${y0-P+l}M${x1+P} ${y1+P-l}V${y1+P}H${x1+P-l}M${x0-P+l} ${y1+P}H${x0-P}V${y1+P-l}`);

}
